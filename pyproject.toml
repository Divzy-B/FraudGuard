[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudguard"
version = "0.1.0"
description = "Reproducible synthetic fraud-detection portfolio project"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "FraudGuard Contributors"}]
dependencies = [
  "fastapi>=0.110,<0.116",
  "joblib>=1.3",
  "numpy>=1.26,<3.0",
  "pandas>=2.1,<3.0",
  "pydantic>=2.0,<3.0",
  "scikit-learn>=1.3,<2.0",
  "shap>=0.44,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "xgboost>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<0.29", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["fraudguard*"]
